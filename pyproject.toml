[project]
name = "evalkit"
version = "0.1.0"
description = "Production evaluation harness for AI agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
ef = "evalkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]
