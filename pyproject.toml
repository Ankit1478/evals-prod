[project]
name = "evalkit"
version = "0.1.0"
description = "Production evaluation harness for AI agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "anthropic[bedrock]>=1.8.0",
]

[project.scripts]
ef = "evalkit.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
# vendor/llm_judge is a vendored copy of the LLM_AS_JUDGE project, kept
# byte-identical to upstream so a re-sync is a plain rsync. Its own suite
# runs here too, so the copy can never drift silently.
testpaths = ["tests", "vendor/llm_judge/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit", "vendor/llm_judge/src/llm_judge"]
